<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색엔진 색인만 막는다. 페이지 자체는 누구나 열 수 있어야 하므로
     (Play Console이 로그인 없이 접근 가능한 URL을 요구한다) 접근 제한은 걸지 않는다. -->
<meta name="robots" content="noindex, nofollow">
<title>{{ page.title }}</title>
<style>
  :root { color-scheme: light dark; }
  body {
    max-width: 44rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic",
                 "Apple SD Gothic Neo", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: #24292f;
    background: #ffffff;
    word-break: keep-all;
  }
  h1 { font-size: 1.6rem; line-height: 1.4; margin-bottom: 0.5rem; }
  h2 { font-size: 1.2rem; margin-top: 2.5rem; }
  h3 { font-size: 1.02rem; margin-top: 1.75rem; }
  hr { border: 0; border-top: 1px solid #d8dee4; margin: 2rem 0; }
  code {
    background: #f0f1f3;
    padding: 0.15em 0.35em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  /* 표는 좁은 화면에서 가로로만 스크롤시킨다 (본문이 밀리지 않게) */
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.94rem; }
  th, td { border: 1px solid #d8dee4; padding: 0.5rem 0.7rem; text-align: left; }
  th { background: #f6f8fa; }
  em { color: #57606a; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    hr { border-top-color: #30363d; }
    code { background: #21262d; }
    th, td { border-color: #30363d; }
    th { background: #161b22; }
    em { color: #8b949e; }
  }
</style>
</head>
<body>
{{ content }}
<script>
  // 마크다운이 만든 표를 감싸서 좁은 화면에서 가로 스크롤되게 한다.
  document.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
</script>
</body>
</html>
